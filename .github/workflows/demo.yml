name: Demo

# Records docs/demo.gif from docs/demo.tape. Run it by hand after UI changes,
# download the "demo" artifact and commit the GIF.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: mkdir -p docs/shots
      - uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2
        with:
          path: docs/demo.tape
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo
          path: |
            docs/demo.gif
            docs/shots/
