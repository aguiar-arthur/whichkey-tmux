name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LANG: C.UTF-8

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shfmt
        run: sudo apt-get update && sudo apt-get install -y shfmt
      - run: shellcheck --version && shfmt --version
      - run: make lint

  unit:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # On macOS, /bin/bash is 3.2: the oldest bash the plugin supports.
      - name: Unit tests
        run: |
          if [ "$RUNNER_OS" = macOS ]; then /bin/bash tests/unit.sh; else bash tests/unit.sh; fi

  e2e-linux:
    name: e2e (tmux ${{ matrix.tmux }}, Linux)
    strategy:
      fail-fast: false
      matrix:
        tmux: ["3.4", "3.5a", "3.6b", "3.7c", "3.8"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libevent-dev libncurses-dev bison pkg-config
      - uses: actions/cache@v4
        id: cache
        with:
          path: ~/tmux
          key: tmux-${{ matrix.tmux }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build tmux ${{ matrix.tmux }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/tmux/tmux/releases/download/${{ matrix.tmux }}/tmux-${{ matrix.tmux }}.tar.gz" | tar xz
          cd "tmux-${{ matrix.tmux }}"
          ./configure --prefix="$HOME/tmux"
          make -j"$(nproc)"
          make install
      - run: echo "$HOME/tmux/bin" >>"$GITHUB_PATH"
      - run: tmux -V
      - run: make e2e

  e2e-macos:
    name: e2e (tmux latest, macOS, bash 3.2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install tmux
      - run: tmux -V
      # /bin first, so the scripts run on the system bash 3.2 as on a stock Mac.
      - run: PATH="/bin:$PATH" bash --version | head -1
      - run: PATH="/bin:$PATH" make e2e
