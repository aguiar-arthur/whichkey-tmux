# Config for docs/demo.tape: a small set of bindings with notes.
set -g default-command 'env PS1="$ " bash --norc --noprofile'
set -g @whichkey-auto on
set -g @whichkey-delay 400
set -g status-style "bg=#282a36,fg=#f8f8f2"
set -g status-left "#[bg=#bd93f9,fg=#282a36,bold] #S #[default] "
set -g status-right ""
set -g pane-active-border-style "fg=#bd93f9"
set -g menu-style "bg=#282a36,fg=#f8f8f2"
set -g menu-selected-style "bg=#44475a,fg=#f8f8f2"
set -g menu-border-style "fg=#bd93f9"
set -g popup-border-style "fg=#bd93f9"

bind -N "Split right" | split-window -h -c "#{pane_current_path}"
bind -N "Split below" - split-window -v -c "#{pane_current_path}"
bind -N "Zoom pane" z resize-pane -Z
bind -N "Reload config" r source-file ~/.tmux.conf
bind -N "Lazygit" G display-popup -E -w 90% -h 90% lazygit
bind -N "Scratch session" S display-popup -E "tmux new -A -s scratch"
bind -N "+window" w switch-client -T window
bind -T window -N "New window" n new-window
bind -T window -N "Next window" l next-window
bind -T window -N "Previous window" h previous-window
bind -T window -N "Rename window" r command-prompt -I "#W" "rename-window '%%'"
bind -T window -N "Kill window" x kill-window

run-shell "#{d:current_file}/../whichkey.tmux"
