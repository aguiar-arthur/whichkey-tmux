# Starter bindings for whichkey-tmux: three groups, each a key table of its
# own, with a note on every binding so the popup reads like a menu. They add
# to tmux's defaults and replace none (W, P and S are free in a stock tmux).
#
# Copy what you like into tmux.conf, or load the whole file there, before
# the plugin:
#
#   source-file ~/path/to/whichkey-tmux/examples/starter.conf
#
# Then: prefix, pause, W -> the window group, and so on.

bind -N "+window" W switch-client -T window
bind -T window -N "New window" c new-window -c "#{pane_current_path}"
bind -T window -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -T window -N "Next window" n next-window
bind -T window -N "Previous window" p previous-window
bind -T window -N "Last window" l last-window
bind -T window -N "Choose a window" w choose-tree -Zw
bind -T window -N "Move window left" < swap-window -d -t -1
bind -T window -N "Move window right" > swap-window -d -t +1
bind -T window -N "Kill window" x confirm-before -p "kill-window #W? (y/n)" kill-window

bind -N "+pane" P switch-client -T pane
bind -T pane -N "Split right" v split-window -h -c "#{pane_current_path}"
bind -T pane -N "Split below" s split-window -v -c "#{pane_current_path}"
bind -T pane -N "Zoom pane" z resize-pane -Z
bind -T pane -N "Break pane into a window" b break-pane
bind -T pane -N "Swap with the next pane" n swap-pane -D
bind -T pane -N "Next layout" Space next-layout
bind -T pane -N "Show pane numbers" q display-panes
bind -T pane -N "Kill pane" x confirm-before -p "kill-pane #P? (y/n)" kill-pane

bind -N "+session" S switch-client -T session
bind -T session -N "New session" c new-session
bind -T session -N "Rename session" r command-prompt -I "#S" "rename-session -- '%%'"
bind -T session -N "Choose a session" s choose-tree -Zs
bind -T session -N "Next session" n switch-client -n
bind -T session -N "Previous session" p switch-client -p
bind -T session -N "Last session" l switch-client -l
bind -T session -N "Detach" d detach-client
